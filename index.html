<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập sử dụng thẻ hình ảnh</title>
</head>
<body>
    <h1>Trưng bày hình ảnh yêu thích</h1>

    <!-- 
      - Thẻ <img> là thẻ tự đóng (không có thẻ đóng </img>).
      - src: Đường dẫn ảnh (URL online hoặc đường dẫn file cục bộ).
      - alt: Mô tả nội dung bức ảnh (hiển thị khi ảnh lỗi hoặc hỗ trợ trình đọc màn hình).
      - width/height (tùy chọn): Giữ kích thước hiển thị cân đối.
    -->
    <img 
        src="https://picsum.photos/600/400" 
        alt="Một bức ảnh phong cảnh thiên nhiên ngẫu nhiên"
        width="600"
    >
</body>
</html>
